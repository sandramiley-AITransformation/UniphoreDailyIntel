<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="Daily competitive-intelligence briefing for Uniphore — archived edition.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --ink:#121A28;
    --ink-dim:#525F72;
    --ink-faint:#7E8A9C;
    --border:#D9DEE6;
    --rule:#E7EAF0;
    --accent:#A9791F;
    --accent-ink:#5B4110;
    --quote-bar:#A9791F;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C1420;
      --surface:#121C2B;
      --ink:#E8ECF3;
      --ink-dim:#9FABBD;
      --ink-faint:#6E7A8D;
      --border:#243044;
      --rule:#1C2839;
      --accent:#DBAE4E;
      --accent-ink:#F2D392;
      --quote-bar:#DBAE4E;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.62;
    font-optical-sizing:auto;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:clamp(28px,5vw,64px) clamp(20px,5vw,40px) 96px;
  }
  .report{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:clamp(28px,5vw,64px);
    box-shadow:0 1px 2px rgba(18,26,40,.04), 0 18px 48px -24px rgba(18,26,40,.22);
  }
  /* Masthead: kicker + h1 + edition meta-line */
  .report > p:first-of-type em{font-style:normal}
  .report em:first-child{}
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(2.4rem,6vw,3.4rem);
    line-height:1.04;
    letter-spacing:-.015em;
    margin:.1em 0 .35em;
  }
  h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.65rem;
    line-height:1.18;
    letter-spacing:-.01em;
    margin:2.2em 0 .5em;
    padding-bottom:.3em;
    border-bottom:1px solid var(--rule);
  }
  h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.24rem;
    line-height:1.25;
    margin:1.7em 0 .2em;
  }
  h4{
    font-family:var(--sans);
    font-weight:600;
    font-size:1rem;
    margin:1.4em 0 .2em;
  }
  p{margin:.7em 0}
  a{color:var(--accent-ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:2px}
  a:hover{text-decoration-color:var(--accent)}
  strong{font-weight:600}
  em{font-style:italic}

  /* Kicker (first italic line) + edition meta */
  .report > em:first-child,
  .report p em:only-child{}
  .kicker-line{
    font-family:var(--mono);
    font-style:normal;
    font-size:.74rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .meta-line{
    font-family:var(--sans);
    font-size:.86rem;
    color:var(--ink-faint);
    margin-top:-.2em;
  }

  /* Section labels (were <span class="label">) -> small caps eyebrow */
  p.label{
    font-family:var(--sans);
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin:2.4em 0 -.2em;
  }
  /* Card / item meta (source · vendor) */
  p.card-meta{
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:1.9em 0 -.35em;
  }
  p.label-italic{
    font-family:var(--sans);
    font-size:.9rem;
    color:var(--ink-dim);
    margin:.2em 0;
  }

  ul,ol{margin:.6em 0 1em;padding-left:1.3em}
  li{margin:.5em 0;padding-left:.2em}
  li::marker{color:var(--accent)}
  li strong:first-child{color:var(--ink)}

  blockquote{
    margin:1em 0;
    padding:.1em 0 .1em 1.1em;
    border-left:3px solid var(--quote-bar);
    font-family:var(--serif);
    font-style:italic;
    font-size:1.15rem;
    color:var(--ink);
  }
  blockquote p{margin:.2em 0}

  hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}

  .report-footer{
    max-width:760px;
    margin:20px auto 0;
    padding:0 clamp(20px,5vw,40px);
    font-family:var(--sans);
    font-size:.78rem;
    color:var(--ink-faint);
    text-align:center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <article class="report">
{{CONTENT}}
    </article>
  </div>
  <div class="report-footer">
    Generated {{GENERATED_HUMAN}} · Uniphore Daily Intel · archived HTML edition
  </div>
</body>
</html>
